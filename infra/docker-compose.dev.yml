# Local development dependencies. Ports bind to localhost only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jstyle
      POSTGRES_PASSWORD: jstyle
      POSTGRES_DB: jstyle
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
volumes:
  pgdata:
