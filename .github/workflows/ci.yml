name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jstyle
          POSTGRES_PASSWORD: jstyle
          POSTGRES_DB: jstyle_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JSTYLE_TEST_DATABASE_URL: postgresql+psycopg://jstyle:jstyle@localhost:5432/jstyle_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: PDF libraries (WeasyPrint)
        run: sudo apt-get update -q && sudo apt-get install -y -q libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npx next build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start stack and check health
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            curl -fs http://localhost:8000/api/health && break
            sleep 2
          done
          curl -fs http://localhost:8000/api/health
          curl -fs -X POST -o /dev/null -w "%{http_code}\n" http://localhost:8000/api/auth/dev-login | grep 303
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
