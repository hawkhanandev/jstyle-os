# Local development: `docker compose up --build`, then open http://localhost:3000
# Everything runs on your machine. No Google, Cloudflare or VPS account is needed.
#
# Host ports avoid the usual defaults so they don't clash with a Postgres or Redis you
# already run. Change any of them in a .env file next to this one, e.g. JSTYLE_WEB_PORT=3100.
name: jstyle-os

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jstyle
      POSTGRES_PASSWORD: jstyle
      POSTGRES_DB: jstyle
    ports: ["127.0.0.1:${JSTYLE_PG_PORT:-55432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "jstyle"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    # Not published to your machine; only the app containers use it.

  # Catches every email the CRM sends while running locally. Inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:${JSTYLE_MAIL_PORT:-8025}:8025"]

  api:
    build: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      JSTYLE_ENV: local
      JSTYLE_DATABASE_URL: postgresql+psycopg://jstyle:jstyle@postgres:5432/jstyle
      JSTYLE_REDIS_URL: redis://redis:6379/0
      JSTYLE_PUBLIC_BASE_URL: http://localhost:${JSTYLE_WEB_PORT:-3000}
      JSTYLE_ALLOWED_EMAIL: ${JSTYLE_ALLOWED_EMAIL:-owner@jstyle.local}
      JSTYLE_SMTP_HOST: mailpit
      JSTYLE_SMTP_PORT: "1025"
      JSTYLE_STORAGE_DIR: /data/documents
    command: >
      sh -c "alembic upgrade head && python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/api/migrations:/app/migrations
      - documents:/data/documents
    ports: ["127.0.0.1:${JSTYLE_API_PORT:-8000}:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  # Sends queued emails (to Mailpit locally) and runs scheduled jobs.
  worker:
    build: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      JSTYLE_ENV: local
      JSTYLE_DATABASE_URL: postgresql+psycopg://jstyle:jstyle@postgres:5432/jstyle
      JSTYLE_PUBLIC_BASE_URL: http://localhost:${JSTYLE_WEB_PORT:-3000}
      JSTYLE_ALLOWED_EMAIL: ${JSTYLE_ALLOWED_EMAIL:-owner@jstyle.local}
      JSTYLE_SMTP_HOST: mailpit
      JSTYLE_SMTP_PORT: "1025"
      JSTYLE_STORAGE_DIR: /data/documents
    command: python -m app.worker
    volumes: ["./apps/api/app:/app/app", "documents:/data/documents"]
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

  web:
    build: ./apps/web
    environment:
      API_URL: http://api:8000
    volumes: ["./apps/web/src:/app/src"]
    ports: ["127.0.0.1:${JSTYLE_WEB_PORT:-3000}:3000"]
    depends_on: [api]

volumes:
  pgdata:
  documents:
