# Local development: `docker compose up --build`, then open http://localhost:3000
# Everything runs on your machine. No Google, Cloudflare or VPS account is needed.
name: jstyle-os

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jstyle
      POSTGRES_PASSWORD: jstyle
      POSTGRES_DB: jstyle
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "jstyle"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]

  # Catches every email the CRM sends while running locally. Inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

  api:
    build: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      JSTYLE_ENV: local
      JSTYLE_DATABASE_URL: postgresql+psycopg://jstyle:jstyle@postgres:5432/jstyle
      JSTYLE_REDIS_URL: redis://redis:6379/0
      JSTYLE_PUBLIC_BASE_URL: http://localhost:3000
      JSTYLE_ALLOWED_EMAIL: ${JSTYLE_ALLOWED_EMAIL:-owner@jstyle.local}
      JSTYLE_SMTP_HOST: mailpit
      JSTYLE_SMTP_PORT: "1025"
    command: >
      sh -c "alembic upgrade head && python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ["./apps/api/app:/app/app", "./apps/api/migrations:/app/migrations"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  web:
    build: ./apps/web
    environment:
      API_URL: http://api:8000
    volumes: ["./apps/web/src:/app/src"]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
